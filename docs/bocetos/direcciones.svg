<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" width="1260" height="700" font-family="Georgia, serif">
  <title>Boceto comparativo de direcciones artísticas</title>
  <defs>
    <radialGradient id="lampara" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#F2A93B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1C1A17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pielA" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#E8B48A"/><stop offset="1" stop-color="#8A5638"/>
    </radialGradient>
    <pattern id="reticula" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1E1E1C" stroke-opacity=".08"/>
    </pattern>
    <pattern id="hule" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#F4EFE6"/>
      <rect width="20" height="20" fill="#C0392B" opacity=".85"/>
      <rect x="20" y="20" width="20" height="20" fill="#C0392B" opacity=".85"/>
    </pattern>
    <filter id="sombra"><feDropShadow dx="4" dy="5" stdDeviation="3" flood-opacity=".35"/></filter>
  </defs>

  <!-- A: Boliche de noche -->
  <g>
    <rect width="420" height="700" fill="#1C1A17"/>
    <rect width="420" height="700" fill="url(#lampara)"/>
    <text x="24" y="44" fill="#EFE3C8" font-size="24">A · Boliche de noche</text>
    <g transform="translate(24,62)">
      <rect width="40" height="22" fill="#2F5D50"/><rect x="44" width="40" height="22" fill="#6B4226"/>
      <rect x="88" width="40" height="22" fill="#EFE3C8"/><rect x="132" width="40" height="22" fill="#F2A93B"/>
      <rect x="176" width="40" height="22" fill="#7A1F2B"/><rect x="220" width="40" height="22" fill="#1C1A17" stroke="#EFE3C8" stroke-opacity=".3"/>
    </g>
    <g transform="translate(40,120) rotate(-4)" filter="url(#sombra)">
      <rect width="150" height="230" rx="10" fill="#EFE3C8"/>
      <rect x="6" y="6" width="138" height="218" rx="7" fill="none" stroke="#7A1F2B" stroke-width="1.5"/>
      <text x="16" y="40" fill="#7A1F2B" font-size="30">2</text>
      <path d="M52 80 q23 52 46 0 z" fill="#7A1F2B" opacity=".9"/>
      <rect x="71" y="112" width="8" height="38" fill="#7A1F2B"/>
      <ellipse cx="75" cy="156" rx="24" ry="6" fill="#7A1F2B"/>
      <path d="M52 182 q23 -40 46 0 z" fill="#7A1F2B" opacity=".9"/>
      <text x="134" y="218" fill="#7A1F2B" font-size="30" text-anchor="end">2</text>
    </g>
    <g transform="translate(300,250)">
      <ellipse cx="0" cy="0" rx="62" ry="78" fill="url(#pielA)"/>
      <path d="M-62 -10 q0 -80 62 -80 q62 0 62 80 q-20 -50 -62 -50 q-42 0 -62 50z" fill="#3A2A20"/>
      <path d="M-40 -18 q14 -8 28 0" stroke="#3A2A20" stroke-width="4" fill="none"/>
      <path d="M12 -20 q14 -6 28 2" stroke="#3A2A20" stroke-width="4" fill="none"/>
      <path d="M-38 0 q12 6 24 0" stroke="#1C1A17" stroke-width="3" fill="none"/>
      <ellipse cx="26" cy="-2" rx="9" ry="6" fill="#1C1A17"/>
      <path d="M-18 40 q18 10 36 0" stroke="#5A2E22" stroke-width="4" fill="none"/>
    </g>
    <text x="300" y="352" fill="#EFE3C8" font-size="13" text-anchor="middle" opacity=".8">guiño derecho (perico)</text>
    <g fill="#EFE3C8" font-size="15" font-family="Arial, sans-serif">
      <text x="24" y="420">+ atmósfera, impacto emocional</text>
      <text x="24" y="446">− el guiño se pierde con poca luz</text>
      <text x="24" y="472">− cada expresión es un dibujo nuevo</text>
      <text x="24" y="498">Producción: alta</text>
    </g>
  </g>

  <!-- B: Taller constructivo (recomendada) -->
  <g transform="translate(420,0)">
    <rect width="420" height="700" fill="#EDE6D6"/>
    <rect width="420" height="700" fill="url(#reticula)"/>
    <rect x="3" y="3" width="414" height="694" fill="none" stroke="#A8432F" stroke-width="6"/>
    <text x="24" y="44" fill="#1E1E1C" font-size="24" font-family="Arial, sans-serif" font-weight="bold">B · Taller constructivo</text>
    <text x="396" y="44" fill="#A8432F" font-size="13" font-family="Arial, sans-serif" text-anchor="end" font-weight="bold">RECOMENDADA</text>
    <g transform="translate(24,62)">
      <rect width="34" height="22" fill="#EDE6D6" stroke="#1E1E1C"/><rect x="38" width="34" height="22" fill="#1E1E1C"/>
      <rect x="76" width="34" height="22" fill="#C8963E"/><rect x="114" width="34" height="22" fill="#A8432F"/>
      <rect x="152" width="34" height="22" fill="#2E4A62"/><rect x="190" width="34" height="22" fill="#5F6B3A"/>
      <rect x="228" width="34" height="22" fill="#8C877D"/>
    </g>
    <g transform="translate(40,120)">
      <rect width="150" height="230" rx="8" fill="#EDE6D6" stroke="#1E1E1C" stroke-width="5"/>
      <text x="14" y="44" fill="#1E1E1C" font-size="40" font-family="Arial, sans-serif" font-weight="bold">2</text>
      <path d="M18 54 h18 l-4 9 h-10 z" fill="#A8432F"/>
      <path d="M45 82 h60 l-12 34 h-36 z" fill="#A8432F"/>
      <rect x="70" y="116" width="10" height="26" fill="#A8432F"/>
      <rect x="54" y="142" width="42" height="9" fill="#A8432F"/>
      <rect x="45" y="168" width="60" height="6" fill="#1E1E1C"/>
      <text x="136" y="214" fill="#1E1E1C" font-size="40" font-family="Arial, sans-serif" font-weight="bold" text-anchor="end">2</text>
      <g transform="translate(150,0)">
        <path d="M0 -20 l6 13 14 2 -10 10 3 14 -13 -7 -13 7 3 -14 -10 -10 14 -2z" fill="#C8963E" stroke="#1E1E1C" stroke-width="3"/>
        <text x="0" y="8" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#1E1E1C">1</text>
      </g>
    </g>
    <g transform="translate(300,250)">
      <rect x="-60" y="-78" width="120" height="156" fill="#C8963E" stroke="#1E1E1C" stroke-width="4"/>
      <rect x="-60" y="-78" width="120" height="40" fill="#1E1E1C"/>
      <rect x="0" y="-38" width="60" height="116" fill="#A8432F" opacity=".25"/>
      <rect x="-42" y="-24" width="30" height="7" fill="#1E1E1C"/>
      <rect x="12" y="-28" width="30" height="7" fill="#1E1E1C" transform="rotate(-8 27 -24)"/>
      <rect x="-38" y="0" width="22" height="5" fill="#1E1E1C"/>
      <rect x="20" y="-8" width="14" height="14" fill="#EDE6D6" stroke="#1E1E1C" stroke-width="3"/>
      <rect x="24" y="-4" width="6" height="6" fill="#1E1E1C"/>
      <rect x="-6" y="6" width="12" height="20" fill="#A8432F"/>
      <rect x="-22" y="40" width="44" height="7" fill="#1E1E1C"/>
    </g>
    <text x="300" y="352" fill="#1E1E1C" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">guiño derecho (perico)</text>
    <g fill="#1E1E1C" font-size="15" font-family="Arial, sans-serif">
      <text x="24" y="420">+ señas nítidas: cada rasgo es una capa</text>
      <text x="24" y="446">+ palos con forma propia, no solo color</text>
      <text x="24" y="472">+ insignia de pieza con forma y número</text>
      <text x="24" y="498">− necesita textura y luz cálida</text>
      <text x="24" y="524">Producción: media, buena parte por código</text>
    </g>
  </g>

  <!-- C: Sobremesa de papel -->
  <g transform="translate(840,0)">
    <rect width="420" height="700" fill="url(#hule)"/>
    <rect x="12" y="14" width="396" height="84" fill="#F4EFE6" opacity=".92"/>
    <text x="24" y="44" fill="#1E1E1C" font-size="24" font-family="'Comic Sans MS', cursive">C · Sobremesa de papel</text>
    <g transform="translate(24,62)">
      <rect width="40" height="22" fill="#C0392B"/><rect x="44" width="40" height="22" fill="#F4EFE6" stroke="#1E1E1C" stroke-opacity=".3"/>
      <rect x="88" width="40" height="22" fill="#F2C14E"/><rect x="132" width="40" height="22" fill="#6A994E"/>
      <rect x="176" width="40" height="22" fill="#A47551"/><rect x="220" width="40" height="22" fill="#8EC5E8"/>
    </g>
    <g transform="translate(40,120) rotate(3)" filter="url(#sombra)">
      <path d="M4 2 L146 6 L150 120 L147 228 L6 232 L1 110 Z" fill="#E9D8B8"/>
      <text x="16" y="42" fill="#C0392B" font-size="32" font-family="'Comic Sans MS', cursive">2</text>
      <path d="M48 84 L104 80 L94 118 L60 120 Z" fill="#C0392B"/>
      <path d="M70 120 L82 120 L80 146 L72 146 Z" fill="#C0392B"/>
      <path d="M54 146 L98 144 L100 154 L52 156 Z" fill="#C0392B"/>
      <text x="134" y="214" fill="#C0392B" font-size="32" font-family="'Comic Sans MS', cursive" text-anchor="end">2</text>
    </g>
    <g transform="translate(300,250)" filter="url(#sombra)">
      <circle r="70" fill="#A47551"/>
      <circle r="70" fill="none" stroke="#7A5638" stroke-width="3" stroke-dasharray="6 5"/>
      <path d="M-40 -4 h26" stroke="#1E1E1C" stroke-width="4"/>
      <circle cx="26" cy="-6" r="10" fill="#F4EFE6"/><circle cx="26" cy="-6" r="4" fill="#1E1E1C"/>
      <path d="M-24 34 q24 14 48 0" stroke="#C0392B" stroke-width="6" fill="none"/>
      <circle cx="-62" cy="0" r="4" fill="#C8963E"/><circle cx="62" cy="0" r="4" fill="#C8963E"/>
    </g>
    <rect x="200" y="338" width="200" height="22" fill="#F4EFE6" opacity=".92"/>
    <text x="300" y="354" fill="#1E1E1C" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">guiño derecho (perico)</text>
    <rect x="12" y="398" width="396" height="140" fill="#F4EFE6" opacity=".92"/>
    <g fill="#1E1E1C" font-size="15" font-family="Arial, sans-serif">
      <text x="24" y="420">+ cálida y amable para principiantes</text>
      <text x="24" y="446">− tono infantil frente a farolear y provocar</text>
      <text x="24" y="472">− bordes irregulares restan legibilidad</text>
      <text x="24" y="498">− el hule compite con las cartas</text>
      <text x="24" y="524">Producción: media</text>
    </g>
  </g>

  <text x="630" y="680" fill="#8C877D" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">Boceto de referencia. No es un recurso del juego.</text>
</svg>
